name: Activity Graph
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        
      - uses: ashutosh00710/github-readme-activity-graph@main
        # FIX: GITHUB_TOKEN must be in an 'env:' block
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 'with:' is for the action's specific inputs
        with:
          GRAPH_THEME: github-dark
          AREA: true